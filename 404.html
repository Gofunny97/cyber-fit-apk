<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#03040a">
<title>NEON//FIT — 页面未找到</title>
<style>
*,*::before,*::after{box-sizing:border-box}
body{
  margin:0;min-height:100vh;display:grid;place-items:center;
  background:#03040a;color:#e8f4ff;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
  padding:24px;text-align:center;
  background-image:
    linear-gradient(rgba(0,240,255,.045) 1px,transparent 1px),
    linear-gradient(90deg,rgba(0,240,255,.045) 1px,transparent 1px);
  background-size:48px 48px;
}
.box{max-width:420px;width:100%}
.logo{
  font-family:ui-monospace,"SFMono-Regular",Consolas,monospace;
  font-size:26px;font-weight:800;letter-spacing:.08em;margin-bottom:26px;
  background:linear-gradient(92deg,#00f0ff,#a855f7,#ff2d95);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.code{
  font-family:ui-monospace,"SFMono-Regular",Consolas,monospace;
  font-size:66px;font-weight:800;line-height:1;margin-bottom:14px;
  background:linear-gradient(135deg,#00f0ff,#ff2d95);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  text-shadow:0 0 40px rgba(0,240,255,.28);
}
h1{font-size:16px;font-weight:600;margin:0 0 10px}
p{font-size:13px;line-height:1.8;color:#8fa3c8;margin:0 0 26px}
.btn{
  display:inline-flex;align-items:center;gap:8px;
  padding:13px 28px;border-radius:11px;
  background:linear-gradient(135deg,#00f0ff,#3aa8ff);
  color:#031018;font-size:14px;font-weight:700;text-decoration:none;
  box-shadow:0 6px 26px rgba(0,240,255,.28);
  transition:transform .25s,box-shadow .25s;
}
.btn:hover{transform:translateY(-2px);box-shadow:0 10px 34px rgba(0,240,255,.42)}
.btn:active{transform:translateY(0) scale(.98)}
svg{width:17px;height:17px}
</style>
</head>
<body>
<div class="box">
  <div class="logo">NEON//FIT</div>
  <div class="code">404</div>
  <h1>该页面不存在</h1>
  <p>你访问的地址有误或已被移除。<br>点击下方按钮回到终端主控台。</p>
  <a class="btn" href="./index.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 9.5 12 3l9 6.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>
    </svg>
    返回主页
  </a>
</div>
<script>
  // 若从子路径进入，尝试回到根目录的 index.html
  setTimeout(function(){
    if(location.pathname !== "/" && location.pathname !== "/index.html"){
      var l = document.querySelector(".btn");
      if(l) l.setAttribute("href", new URL("./index.html", location.origin + "/").href);
    }
  }, 10);
</script>
</body>
</html>
